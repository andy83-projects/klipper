# Monthly: merge upstream Klipper into b1-stable (the branch the BIQU B1
# printer tracks), run Klipper's full CI, and push only if everything passes.
# Merging (never rebasing) keeps b1-stable fast-forward-only, so Moonraker on
# the printer can always update with a plain pull. A merge conflict or a test
# failure fails this run, pushes nothing, and GitHub emails the repo owner.
name: Monthly upstream sync (b1-stable)
on:
  schedule:
    - cron: '23 7 1 * *'   # 07:23 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b1-monthly-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'andy83-projects/klipper'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: b1-stable
        fetch-depth: 0

    - name: Merge upstream Klipper master
      id: merge
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git remote add upstream https://github.com/Klipper3d/klipper.git
        git fetch --no-tags upstream master
        if git merge-base --is-ancestor upstream/master HEAD; then
          echo "b1-stable already contains upstream/master; nothing to do."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Upstream commits to merge:"
        git log --oneline HEAD..upstream/master
        if ! git merge --no-edit -m "Merge upstream Klipper master (monthly sync)" upstream/master; then
          echo "::error::Merge conflict with upstream; b1-stable left unchanged."
          git diff --name-only --diff-filter=U
          exit 1
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Setup cache
      if: steps.merge.outputs.changed == 'true'
      uses: actions/cache@v5
      with:
        path: ci_cache
        key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

    - name: Prepare Klipper tests
      if: steps.merge.outputs.changed == 'true'
      run: ./scripts/ci-install.sh

    - name: Run Klipper tests
      if: steps.merge.outputs.changed == 'true'
      run: ./scripts/ci-build.sh 2>&1

    - name: Check B1 patch options still parse
      if: steps.merge.outputs.changed == 'true'
      run: |
        python3 -m py_compile klippy/extras/probe.py klippy/extras/homing.py \
          klippy/extras/z_tilt.py klippy/mcu.py klippy/stepper.py
        grep -q "safety_endstop_pin" klippy/extras/probe.py
        grep -q "verify_deploy" klippy/extras/probe.py
        grep -q "min_adjust_z1" klippy/extras/z_tilt.py

    - name: Push b1-stable
      if: steps.merge.outputs.changed == 'true'
      run: git push origin HEAD:b1-stable
